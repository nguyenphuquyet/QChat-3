name: qchat_miniapp_quickjs
description: >-
  Android QuickJS service runtime for QChat Mini Apps: one JavaScript runtime
  per Mini App instance, built from a pinned upstream tarball through CMake for
  arm64-v8a, armeabi-v7a and x86_64. See docs/adr/017.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.qchat.miniapp.quickjs
        pluginClass: QchatQuickjsPlugin
