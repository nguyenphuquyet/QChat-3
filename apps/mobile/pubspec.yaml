name: qchat
description: QChat private cross-platform messaging
publish_to: none
version: 1.1.0+6
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  tdesign_flutter_icons: 0.0.7
  tdesign_flutter: 1.1.0
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  dio: 5.11.1
  socket_io_client: 3.1.6
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter_secure_storage: 11.2.0
  uuid: 4.6.0
  image_picker: 1.2.4
  photo_manager: 3.12.0
  # The photo picker page is the one Material island in the app; see
  # AGENTS.md §8. It ships no MaterialApp, Scaffold or theme of its own: the
  # app wraps it in a Theme built from QChatColors.
  wechat_assets_picker: 10.1.3
  file_picker: 13.1.0
  record: 7.1.2
  just_audio: 0.10.6
  flutter_webrtc: 1.6.2+hotfix.4
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
  shared_preferences: 2.5.6
  cupertino_icons: ^2.0.0
  lucide_icons_flutter: 4.0.1
  video_player: ^2.14.1
  web: 1.1.1
  flutter_js: 0.8.7
  archive: ^3.6.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  # The photo picker page draws itself with Material widgets, so its icon font
  # has to ship. Everything else is still drawn by the QChat design system and
  # still uses the platform's own typeface, never Roboto.
  uses-material-design: true

