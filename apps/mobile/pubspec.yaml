name: qchat
description: QChat private cross-platform messaging
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  tdesign_flutter: 1.0.0
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  dio: 5.11.1
  socket_io_client: 3.1.6
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter_secure_storage: 11.2.0
  uuid: 4.6.0
  image_picker: 1.2.4
  file_picker: 13.1.0
  record: 7.1.2
  just_audio: 0.10.6
  flutter_webrtc: 1.6.2+hotfix.4
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
  shared_preferences: 2.5.6
  cupertino_icons: ^2.0.0
  video_player: ^2.14.1
dev_dependencies:
