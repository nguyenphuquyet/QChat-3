name: Flutter app
# Build and test on GitHub runners; no local build is required.
#
# macOS minutes cost 10x, so the iOS jobs run only when iOS code changed. Use
# "Run workflow" (workflow_dispatch) to force them.

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'apps/mobile/**'
      - 'packages/qchat_miniapp_webview/**'
      - 'packages/qchat_miniapp_quickjs/**'
      - 'packages/miniapp-view-web/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/qchat_miniapp_webview/**'
      - 'packages/qchat_miniapp_quickjs/**'
      - 'packages/miniapp-view-web/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            BASE_SHA="$BASE"
          else
            BASE_SHA="$BEFORE"
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD" | grep -Eq '^(apps/mobile/ios/|packages/[^/]+/ios/)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Check the Mini App WebView bundle is in sync
        working-directory: .
        run: node scripts/check-miniapp-webview-assets.mjs

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [apk, web]
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_URL: ${{ vars.API_URL || 'https://chat.nguyenphuquyet.online/api' }}
      REALTIME_URL: ${{ vars.REALTIME_URL || 'https://chat.nguyenphuquyet.online' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build release
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: >-
          flutter build "$BUILD_TARGET" --release
          --dart-define="API_URL=$API_URL"
          --dart-define="REALTIME_URL=$REALTIME_URL"
      - name: Upload Android APK
        if: matrix.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: qchat-android-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload web bundle
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: qchat-web-${{ github.sha }}
          path: apps/mobile/build/web/
          if-no-files-found: error
          retention-days: 14

  # The owner installs this APK on a real phone. The host code compiles here and
  # its JVM tests run here; neither is device evidence (STATUS.md §5.4).
  android-debug:
    name: Build debug APK and test the WebView host
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_URL: ${{ vars.API_URL || 'https://chat.nguyenphuquyet.online/api' }}
      REALTIME_URL: ${{ vars.REALTIME_URL || 'https://chat.nguyenphuquyet.online' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        id: apk
        # The failure is re-raised by the diagnostic step below, which makes the
        # Gradle error readable from the public checks API (job logs need admin
        # rights, so an unauthenticated reader cannot see why the build failed).
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug \
            --dart-define="API_URL=$API_URL" \
            --dart-define="REALTIME_URL=$REALTIME_URL" \
            2>&1 | tee "$RUNNER_TEMP/apk-build.log"
      - name: Report the Gradle failure
        if: steps.apk.outcome == 'failure'
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/apk-build.log"
          PATTERN='^(e: |w: )|error:|FAILURE:|What went wrong|Caused by|Could not (resolve|find|create|download)|Unresolved reference|Execution failed|> Task .*FAILED|A problem occurred'
          {
            echo '### Debug APK failure'
            echo '```'
            grep -nE "$PATTERN" "$LOG" | head -n 40 || true
            echo '```'
            echo '### Tail'
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub keeps at most ten error annotations per step; they are the only
          # part of a failed job that is readable without repository admin rights.
          # Several log lines are packed into each one so a compiler error list is
          # not cut off after ten lines.
          grep -E "$PATTERN" "$LOG" | head -n 80 | awk '
            { buf = (buf == "" ? $0 : buf " || " $0) }
            length(buf) > 700 { print buf; buf = "" }
            END { if (buf != "") print buf }
          ' | head -n 10 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/''}"
            echo "::error title=Gradle::${line:0:900}"
          done
          exit 1
      - name: Test the Mini App WebView host
        id: hosttests
        continue-on-error: true
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew :qchat_miniapp_webview:testDebugUnitTest --no-daemon \
            2>&1 | tee "$RUNNER_TEMP/host-test.log"
      - name: Report the host test failure
        if: steps.hosttests.outcome == 'failure'
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/host-test.log"
          PATTERN='^(e: |w: )|error:|FAILURE:|What went wrong|Caused by|Could not (resolve|find|create|download)|Unresolved reference|Execution failed|> Task .*FAILED|A problem occurred'
          {
            echo '### Host test failure'
            echo '```'
            grep -nE "$PATTERN" "$LOG" | head -n 40 || true
            echo '```'
            echo '### Tail'
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "$PATTERN" "$LOG" | head -n 80 | awk '
            { buf = (buf == "" ? $0 : buf " || " $0) }
            length(buf) > 700 { print buf; buf = "" }
            END { if (buf != "") print buf }
          ' | head -n 10 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/''}"
            echo "::error title=Host tests::${line:0:900}"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: qchat-android-debug-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: Build iOS Simulator app
    needs: [checks, changes]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_URL: ${{ vars.API_URL || 'https://chat.nguyenphuquyet.online/api' }}
      REALTIME_URL: ${{ vars.REALTIME_URL || 'https://chat.nguyenphuquyet.online' }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Patch ONNX Runtime Extensions download URL
        run: bash tool/patch_onnxruntime_spm.sh
      - name: Build simulator app
        run: >-
          flutter build ios --simulator --debug --no-codesign
          --dart-define="API_URL=$API_URL"
          --dart-define="REALTIME_URL=$REALTIME_URL"
      - name: Package simulator app with permissions preserved
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/qchat-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qchat-ios-simulator-${{ github.sha }}
          path: apps/mobile/build/ios/qchat-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build unsigned iOS IPA
    needs: [checks, changes]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_URL: ${{ vars.API_URL || 'https://chat.nguyenphuquyet.online/api' }}
      REALTIME_URL: ${{ vars.REALTIME_URL || 'https://chat.nguyenphuquyet.online' }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Patch ONNX Runtime Extensions download URL
        run: bash tool/patch_onnxruntime_spm.sh
      - name: Build iOS device app without signing
        run: >-
          flutter build ios --release --no-codesign -v
          --dart-define="API_URL=$API_URL"
          --dart-define="REALTIME_URL=$REALTIME_URL"
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/unsigned/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          zip -qry ../qchat-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: qchat-ios-unsigned-${{ github.sha }}
          path: apps/mobile/build/ios/qchat-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
