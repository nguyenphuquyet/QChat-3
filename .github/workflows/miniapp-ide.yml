name: Mini App Studio

# Builds the Tauri desktop IDE and its installers on every supported OS.
# Rust and the Tauri bundler only run here, so a local Rust toolchain is optional.

on:
  push:
    branches: [main]
    paths:
      - 'apps/miniapp-ide/**'
      - 'packages/miniapp-framework/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/miniapp-ide.yml'
  pull_request:
    paths:
      - 'apps/miniapp-ide/**'
      - 'packages/miniapp-framework/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/miniapp-ide.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-ide-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Typecheck and web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify Corepack
        run: corepack pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the QChat framework CLI
        run: corepack pnpm --filter @mna/qchat build

      - name: Typecheck the IDE
        run: corepack pnpm --filter @qchat/miniapp-ide typecheck

      - name: Build the web frontend
        run: corepack pnpm --filter @qchat/miniapp-ide build:web

      - name: Verify bundled CLI resources
        run: |
          corepack pnpm --filter @qchat/miniapp-ide prepare:cli
          node apps/miniapp-ide/src-tauri/resources/qapp/cli.js version
          test -f apps/miniapp-ide/src-tauri/resources/qapp/node_modules/typescript/bin/tsc
          test -f apps/miniapp-ide/src-tauri/resources/qapp/node_modules/esbuild/lib/main.js
          test -d apps/miniapp-ide/src-tauri/resources/qapp/node_modules/@esbuild
          test -f apps/miniapp-ide/src-tauri/resources/types/qchat-env.d.ts
          test -f apps/miniapp-ide/src-tauri/resources/qapp/types/qchat-env.d.ts

      # A QuickJS-only project outside the checkout: no `@types/node`, no DOM
      # lib. This is the layout an installed Studio builds, and it is where a
      # missing `qchat-env.d.ts` shows up as "Cannot find name 'console'".
      - name: Typecheck a QuickJS-only project with the bundled CLI
        run: |
          probe="$RUNNER_TEMP/qapp-probe"
          mkdir -p "$probe/src"
          cat > "$probe/manifest.json" <<'JSON'
          {
            "schemaVersion": 2,
            "format": "qapp",
            "name": "Probe",
            "description": "Typecheck probe",
            "version": "1.0.0",
            "entry": "app.js",
            "sdkVersion": "1.0.0",
            "minRuntimeVersion": "1.0.0",
            "requestedPermissions": ["toast"],
            "source": "src/main.tsx"
          }
          JSON
          cat > "$probe/tsconfig.json" <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2020",
              "lib": ["ES2020"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "jsxImportSource": "@mna/qchat"
            },
            "include": ["src/**/*.ts", "src/**/*.tsx"]
          }
          JSON
          cat > "$probe/src/main.tsx" <<'TSX'
          import { Text } from "@mna/qchat/ui";
          import "@mna/qchat/env/auto";

          export function App() {
            const id = setInterval(() => console.log("tick"), 1000);
            clearInterval(id);
            setTimeout(() => console.info("later"), 10);
            return <Text>probe</Text>;
          }
          TSX
          node apps/miniapp-ide/src-tauri/resources/qapp/cli.js build \
            --dir "$probe" --out "$RUNNER_TEMP/qapp-probe.japp"

  build:
    name: Build ${{ matrix.name }} installer
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis,msi
            artifacts: |
              apps/miniapp-ide/src-tauri/target/release/bundle/nsis/*.exe
              apps/miniapp-ide/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            name: macos
            bundles: dmg
            artifacts: apps/miniapp-ide/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
            artifacts: |
              apps/miniapp-ide/src-tauri/target/release/bundle/deb/*.deb
              apps/miniapp-ide/src-tauri/target/release/bundle/appimage/*.AppImage
    defaults:
      run:
        working-directory: apps/miniapp-ide
    env:
      # prepare:cli honours this so the packaged app ships its own Node runtime.
      QAPP_BUNDLE_NODE: '1'

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux WebKit dependencies
        if: matrix.name == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify Corepack
        run: corepack pnpm --version

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build the QChat framework CLI
        working-directory: .
        run: corepack pnpm --filter @mna/qchat build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/miniapp-ide/src-tauri -> target

      - name: Bundle CLI, esbuild, TypeScript and Node
        run: corepack pnpm prepare:cli

      - name: Build Tauri installers
        run: corepack pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: qchat-miniapp-studio-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
