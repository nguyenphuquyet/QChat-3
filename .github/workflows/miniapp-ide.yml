name: Mini App Studio

# Builds the Tauri desktop IDE and its installers on every supported OS.
# Rust and the Tauri bundler only run here, so a local Rust toolchain is optional.

on:
  push:
    branches: [main]
    paths:
      - 'apps/miniapp-ide/**'
      - 'packages/miniapp-framework/**'
      - 'packages/miniapp-examples/wechat-demo/**'
      - 'packages/contracts/miniapps.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/miniapp-ide.yml'
  pull_request:
    paths:
      - 'apps/miniapp-ide/**'
      - 'packages/miniapp-framework/**'
      - 'packages/miniapp-examples/wechat-demo/**'
      - 'packages/contracts/miniapps.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/miniapp-ide.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-ide-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Typecheck and web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify Corepack
        run: corepack pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the QChat framework CLI
        run: corepack pnpm --filter @mna/qchat build

      - name: Test the QChat framework
        run: corepack pnpm --filter @mna/qchat test

      - name: Typecheck the IDE
        run: corepack pnpm --filter @qchat/miniapp-ide typecheck

      - name: Test the IDE project model
        run: corepack pnpm --filter @qchat/miniapp-ide test

      - name: Build the web frontend
        run: corepack pnpm --filter @qchat/miniapp-ide build:web

      - name: Verify bundled CLI resources
        run: |
          corepack pnpm --filter @qchat/miniapp-ide prepare:cli
          node apps/miniapp-ide/src-tauri/resources/qapp/cli.js version
          test -f apps/miniapp-ide/src-tauri/resources/qapp/dist/builder.js
          test -f apps/miniapp-ide/src-tauri/resources/qapp/builtin/view/view.wxml
          test -f apps/miniapp-ide/src-tauri/resources/qapp/runtime/host.js
          test -f apps/miniapp-ide/src-tauri/resources/qapp/node_modules/webpack/package.json
          test -f apps/miniapp-ide/src-tauri/resources/qapp/node_modules/glass-easel/package.json

      # A WeChat-shaped project outside the checkout, built by the packaged CLI.
      # This is the layout an installed Studio builds.
      - name: Build a WeChat-shaped probe with the bundled CLI
        run: |
          probe="$RUNNER_TEMP/wechat-probe"
          mkdir -p "$probe/pages/index"
          cat > "$probe/app.json" <<'JSON'
          {
            "pages": ["pages/index/index"],
            "window": { "navigationBarTitleText": "Probe" }
          }
          JSON
          cat > "$probe/app.js" <<'JS'
          App({ globalData: { title: "Probe" } });
          JS
          cat > "$probe/app.wxss" <<'CSS'
          page { background-color: #ffffff; }
          CSS
          cat > "$probe/manifest.json" <<'JSON'
          {
            "name": "Probe",
            "version": "1.0.0",
            "requestedPermissions": ["toast"]
          }
          JSON
          cat > "$probe/pages/index/index.js" <<'JS'
          Page({
            data: { title: "" },
            onLoad() { this.setData({ title: getApp().globalData.title }); },
            noop() {},
          });
          JS
          cat > "$probe/pages/index/index.wxml" <<'WXML'
          <view><text>{{title}}</text><button bindtap="noop">ok</button></view>
          WXML
          node apps/miniapp-ide/src-tauri/resources/qapp/cli.js build \
            "$probe" --out "$RUNNER_TEMP/wechat-probe.japp"
          node apps/miniapp-ide/src-tauri/resources/qapp/cli.js inspect \
            "$RUNNER_TEMP/wechat-probe.japp"

  build:
    name: Build ${{ matrix.name }} installer
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis,msi
            artifacts: |
              apps/miniapp-ide/src-tauri/target/release/bundle/nsis/*.exe
              apps/miniapp-ide/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            name: macos
            bundles: dmg
            artifacts: apps/miniapp-ide/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
            artifacts: |
              apps/miniapp-ide/src-tauri/target/release/bundle/deb/*.deb
              apps/miniapp-ide/src-tauri/target/release/bundle/appimage/*.AppImage
    defaults:
      run:
        working-directory: apps/miniapp-ide
    env:
      # prepare:cli honours this so the packaged app ships its own Node runtime.
      QAPP_BUNDLE_NODE: '1'

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux WebKit dependencies
        if: matrix.name == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify Corepack
        run: corepack pnpm --version

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build the QChat framework CLI
        working-directory: .
        run: corepack pnpm --filter @mna/qchat build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/miniapp-ide/src-tauri -> target

      - name: Bundle CLI and Node
        run: corepack pnpm prepare:cli

      - name: Build Tauri installers
        run: corepack pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: qchat-miniapp-studio-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
