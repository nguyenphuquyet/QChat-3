# Nginx Proxy Manager forwards HTTP to the Docker bridge address on port 3210.
name: qchat
x-backend: &backend
  image: qchat-backend:${QCHAT_VERSION:-local}
  build:
    context: ..
    dockerfile: infra/docker/Dockerfile
    args:
      BUILD_NODE_OPTIONS: --max-old-space-size=1024
  env_file: ../.env
  networks: [private]
  init: true
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qchat
      POSTGRES_USER: qchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ['postgres:/var/lib/postgresql/data']
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qchat -d qchat']
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction
    volumes: ['redis:/data']
    networks: [private]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.3
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes: ['media:/data']
    networks: [private]
    restart: unless-stopped

  storage-init:
    <<: *backend
    environment:
      S3_INTERNAL_ENDPOINT: http://storage:9000
    command: node infra/storage-init.mjs
    depends_on: [storage]

  migrate:
    <<: *backend
    command: pnpm db:migrate
    depends_on:
      postgres: {condition: service_healthy}

  server:
    <<: *backend
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  realtime:
    <<: *backend
    command: pnpm --filter @qchat/realtime start
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports: ['172.17.0.1:3210:80']
    volumes: ['./nginx/vps.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [private]
    depends_on: [server, realtime, storage]
    restart: unless-stopped

networks:
  private:
volumes:
  postgres:
  redis:
  media:
