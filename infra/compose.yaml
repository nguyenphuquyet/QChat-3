name: qchat
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qchat
      POSTGRES_USER: qchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qchat"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes: ["media:/data"]
    restart: unless-stopped
  migrate:
    build: { context: .., dockerfile: infra/docker/Dockerfile }
    env_file: ../.env
    command: pnpm db:migrate
    depends_on:
      postgres: { condition: service_healthy }
  server:
    build: { context: .., dockerfile: infra/docker/Dockerfile }
    env_file: ../.env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      retries: 3
    restart: unless-stopped
  realtime:
    build: { context: .., dockerfile: infra/docker/Dockerfile }
    env_file: ../.env
    command: pnpm --filter @qchat/realtime start
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  proxy:
    image: nginx:1.28-alpine
    ports: ["443:443"]
    volumes:
      [
        "./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro",
        "./certs:/etc/nginx/certs:ro",
      ]
    depends_on: [server, realtime, minio]
    restart: unless-stopped
volumes:
  postgres:
  redis:
  media:
